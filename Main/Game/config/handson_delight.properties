stirring_required=true
stove_time=1.0
youkai_pots=true
oven=true
recipe_book=true
basin=true
keg=true
youkai_steamer=true
kettle=true
cuisine_board=true
youkai_hints=false
skillet_time=1.0
stove=true
cask=true
cutting_board=true
youkai_tank=true
remove_crafting_recipes=true
cooking_pot_time=1.0
skillet=true
grill=true
cooking_pot=true
kettle_time=1.0
